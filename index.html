<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cumpleaños 5º Grado A · 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --border: #E4E2DA;
    --border-soft: #EDE9E4;
    --text: #1A1916;
    --text-muted: #7A7771;
    --green: #0F6E56;
    --green-bg: #E1F5EE;
    --green-border: #A8DFD0;
    --amber: #854F0B;
    --amber-bg: #FAEEDA;
    --amber-border: #F0C97A;
    --red: #791F1F;
    --red-bg: #FCEBEB;
    --gray-bg: #F1EFE8;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 1rem 1.25rem; display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow);
  }
  .header-icon { width: 40px; height: 40px; background: #1A1916; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .header-title { font-size: 16px; font-weight: 600; }
  .header-sub { font-size: 13px; color: var(--text-muted); margin-top: 1px; }

  .container { max-width: 640px; margin: 0 auto; padding: 1.25rem 1rem 5rem; }

  .notice {
    font-size: 13px; color: var(--text-muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 1.25rem; line-height: 1.5;
  }

  .tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px; }
  .tab { flex: 1; padding: 8px 10px; border-radius: var(--radius-sm); border: none; background: transparent; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-muted); font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .tab.active { background: var(--text); color: #fff; }

  .section { display: none; }
  .section.active { display: block; }

  .month-nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .month-nav { display: flex; align-items: center; gap: 10px; }
  .mnav-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 16px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
  .mnav-btn:hover { background: var(--bg); }
  .month-label { font-size: 17px; font-weight: 600; min-width: 150px; text-align: center; }
  .month-count { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 500; background: var(--text); color: #fff; }

  .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.25rem; }
  .s-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem 1rem; box-shadow: var(--shadow); }
  .s-num { font-size: 24px; font-weight: 600; }
  .s-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }

  .bday-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 10px;
    display: flex; align-items: flex-start; gap: 14px; box-shadow: var(--shadow);
    transition: border-color 0.15s, background 0.15s;
  }
  .bday-card.is-today { border-color: var(--green-border); background: #FAFFFD; }
  .bday-card.is-upcoming { border-color: var(--amber-border); background: #FFFEF9; }
  .bday-card.is-paid { background: var(--gray-bg); border-color: var(--border-soft); }

  .day-col { min-width: 36px; text-align: center; padding-top: 3px; }
  .day-num { font-size: 26px; font-weight: 600; line-height: 1; color: var(--text-muted); }
  .day-num.c-green { color: var(--green); }
  .day-num.c-amber { color: var(--amber); }
  .day-num.c-gray { opacity: 0.4; }

  .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; margin-top: 2px; }

  .bday-main { flex: 1; min-width: 0; }
  .bday-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 4px; }
  .bday-name { font-weight: 600; font-size: 14px; }
  .bday-card.is-paid .bday-name { opacity: 0.5; text-decoration: line-through; text-decoration-color: var(--text-muted); }

  .spill { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
  .s-today { background: var(--green-bg); color: #085041; }
  .s-upcoming { background: var(--amber-bg); color: #633806; }
  .s-paid { background: var(--green-bg); color: #085041; }

  .bday-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }
  .bday-cbu { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; word-break: break-all; margin-bottom: 2px; }
  .bday-alias { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  .actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex-shrink: 0; }

  .copy-btn {
    padding: 5px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg);
    cursor: pointer; font-size: 11px; font-weight: 500;
    color: var(--text-muted); font-family: 'DM Sans', sans-serif;
    white-space: nowrap; transition: all 0.15s;
  }
  .copy-btn:hover { background: var(--surface); color: var(--text); }

  .pay-btn {
    padding: 7px 11px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; font-size: 12px; font-weight: 500;
    color: var(--text-muted); font-family: 'DM Sans', sans-serif;
    white-space: nowrap; display: flex; align-items: center; gap: 6px;
    transition: all 0.2s;
  }
  .pay-btn:hover { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
  .pay-btn.paid { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
  .pay-btn.paid:hover { background: var(--red-bg); color: var(--red); border-color: #F09595; }

  .check-circle {
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid currentColor;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.2s;
  }
  .pay-btn.paid .check-circle { background: var(--green); border-color: var(--green); }
  .pay-btn.paid:hover .check-circle { background: var(--red); border-color: var(--red); }
  .check-svg { display: none; }
  .pay-btn.paid .check-svg { display: block; }

  .empty-msg { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 14px; line-height: 1.7; }

  .mes-sep { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 1.2rem 0 6px; padding-left: 2px; }
  .list-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.7rem 1rem; margin-bottom: 7px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
  .list-av { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; flex-shrink: 0; }
  .list-info { flex: 1; min-width: 0; }
  .list-name { font-size: 13px; font-weight: 600; }
  .list-detail { font-size: 12px; color: var(--text-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .paid-badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: var(--green-bg); color: var(--green); font-weight: 500; white-space: nowrap; flex-shrink: 0; }
  .pending-badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: var(--gray-bg); color: var(--text-muted); font-weight: 500; white-space: nowrap; flex-shrink: 0; border: 1px solid var(--border); }

  @media (max-width: 420px) {
    .summary-bar { gap: 6px; }
    .s-card { padding: 0.6rem 0.75rem; }
    .s-num { font-size: 20px; }
    .actions { gap: 5px; }
    .pay-btn { font-size: 11px; padding: 6px 9px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-icon">🎂</div>
  <div>
    <div class="header-title">Cumpleaños 5º Grado A</div>
    <div class="header-sub">Transferencias · 2026</div>
  </div>
</header>

<div class="container">

  <div class="notice">
    📋 Marcá cada transferencia cuando la hagas. El check se guarda solo en tu dispositivo.
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('mes')">Este mes</button>
    <button class="tab" onclick="switchTab('lista')">Todos los alumnos</button>
  </div>

  <div id="tab-mes" class="section active">
    <div class="month-nav-row">
      <div class="month-nav">
        <button class="mnav-btn" onclick="changeMonth(-1)">&#8592;</button>
        <div class="month-label" id="month-label"></div>
        <button class="mnav-btn" onclick="changeMonth(1)">&#8594;</button>
      </div>
      <div class="month-count" id="month-count"></div>
    </div>
    <div class="summary-bar">
      <div class="s-card"><div class="s-num" id="s-total">0</div><div class="s-lbl">Cumpleaños</div></div>
      <div class="s-card"><div class="s-num" id="s-paid" style="color:var(--green);">0</div><div class="s-lbl">Pagados</div></div>
      <div class="s-card"><div class="s-num" id="s-pending" style="color:var(--amber);">0</div><div class="s-lbl">Pendientes</div></div>
    </div>
    <div id="bday-list"></div>
  </div>

  <div id="tab-lista" class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span style="font-size:15px;font-weight:600;">Todos los alumnos</span>
      <span style="font-size:13px;color:var(--text-muted);" id="list-count"></span>
    </div>
    <div id="full-list"></div>
  </div>

</div>

<script>
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const COLORS = [
  {bg:'#EEEDFE',text:'#3C3489'},{bg:'#E1F5EE',text:'#085041'},
  {bg:'#FAECE7',text:'#712B13'},{bg:'#FBEAF0',text:'#72243E'},
  {bg:'#E6F1FB',text:'#0C447C'},{bg:'#EAF3DE',text:'#27500A'},
  {bg:'#FAEEDA',text:'#633806'},{bg:'#FCEBEB',text:'#791F1F'}
];
const ALUMNOS = [
  {nombre:'Santiago Blanco Torralba',dia:3,mes:2,padre:'Soledad',cbu:'0170346540000041755329',alias:'santibb2016',banco:'BBVA'},
  {nombre:'Jean Brandon Perez Vallejo',dia:1,mes:3,padre:'Miguel',cbu:'0000003100049842116799',alias:'',banco:'Mercado Pago'},
  {nombre:'Sophie Solignac',dia:11,mes:3,padre:'Lorena / Alejandro',cbu:'0000003100036891160020',alias:'futuremoney.mp',banco:'Mercado Pago'},
  {nombre:'Simón Karsz',dia:13,mes:4,padre:'Marcia / Ezequiel',cbu:'0140019903401904676851',alias:'BEBE.LORO.POZO',banco:'Provincia'},
  {nombre:'Cruz Serra Oyuela',dia:23,mes:4,padre:'Victoria / Leo',cbu:'0720000788000016588190',alias:'Leoserra',banco:'Santander'},
  {nombre:'Emilia Malikova',dia:4,mes:5,padre:'Elena',cbu:'0000003100009773904348',alias:'elena.776.diurno.mp',banco:'Mercado Pago'},
  {nombre:'Ambar Mmarilungo',dia:6,mes:5,padre:'Maira / Sebas',cbu:'0000003100057509403717',alias:'pm.porotos',banco:'Mercado Pago'},
  {nombre:'Renata Juarez',dia:21,mes:5,padre:'Graciela y Victor',cbu:'0070234030004051988114',alias:'GRABARROS.GAL',banco:'Galicia'},
  {nombre:'Francesca Prieto Mori',dia:9,mes:6,padre:'Natalia / Sergio',cbu:'2850540440094039620858',alias:'natalia79macro',banco:'Macro'},
  {nombre:'Joaquin Gil Molina',dia:18,mes:7,padre:'Alina / Nico',cbu:'0110016730001610858965',alias:'alina.molina',banco:'BNA+'},
  {nombre:'Valentina Bertonazzi',dia:27,mes:7,padre:'Belen / Dany',cbu:'0170019020000001062388',alias:'MUNDOHARINAVIRTUAL',banco:'BBVA'},
  {nombre:'Gael Lux',dia:4,mes:8,padre:'Vero',cbu:'0170101840000005858282',alias:'MANERA.LOMA.ARCO',banco:'BBVA'},
  {nombre:'Federico Belen',dia:18,mes:8,padre:'Gabriela / Gabriel',cbu:'0170182740000031714961',alias:'G.MARECHAL',banco:'BBVA'},
  {nombre:'Benjamin Lopez Hogrefe',dia:4,mes:9,padre:'Sergio / Romi',cbu:'0720166688000001391686',alias:'CUBETA.ALTURA.ASTRO',banco:'Santander'},
  {nombre:'Avril Gonzalez Parada',dia:29,mes:9,padre:'Norma',cbu:'0720197088000002945554',alias:'MADRID.SOMBRA.FLAUTA',banco:'Santander'},
  {nombre:'Anita Santiago',dia:1,mes:10,padre:'Valeria',cbu:'0720413988000001633236',alias:'TROTE.AYUNO.ALTURA',banco:'Santander'},
  {nombre:'Priya De Bello',dia:10,mes:10,padre:'Ingrid / Luis',cbu:'0140014403401451487908',alias:'SERIE.MOSCU.NAIPE',banco:'Provincia'},
  {nombre:'Agustina Mastromarino',dia:14,mes:10,padre:'Viviana / Jorge',cbu:'0170304540000036449079',alias:'PLAYA.ETER.PAPEL',banco:'BBVA'},
  {nombre:'Maia',dia:20,mes:10,padre:'Romina',cbu:'0170196440000001108480',alias:'ROMINACORREABBVA',banco:'BBVA'},
  {nombre:'Eva Dodero Arias',dia:27,mes:10,padre:'Agustina / Jorge',cbu:'0720176588000036097618',alias:'ACEITE.OBOE.LANA',banco:'Santander'},
  {nombre:'Leonel Albarenga Caggiano',dia:2,mes:11,padre:'Barbara / Alejandro',cbu:'0170035040000001620360',alias:'MIEL.RULO.RAYO',banco:'BBVA'},
  {nombre:'Isabella Blanco Perez',dia:17,mes:11,padre:'Silvana / Fernando',cbu:'0720055788000037300304',alias:'silvanadelourdes',banco:'Santander'},
  {nombre:'Lina Ñancucheu',dia:29,mes:11,padre:'Florencia',cbu:'0150925401000125408715',alias:'LAMINA.AFRICA.ASTRO',banco:'ICBC'},
];

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

function getPagos() { try { return JSON.parse(localStorage.getItem('pagos_5toA_2026') || '{}'); } catch { return {}; } }
function pagoKey(a) { return a.mes + '-' + a.dia + '-' + a.nombre; }
function isPaid(a) { return !!getPagos()[pagoKey(a)]; }
function togglePago(nombre, mes, dia) {
  const p = getPagos();
  const k = mes + '-' + dia + '-' + nombre;
  if (p[k]) delete p[k]; else p[k] = 1;
  try { localStorage.setItem('pagos_5toA_2026', JSON.stringify(p)); } catch {}
  renderMes();
}

function colorFor(n) { let h=0; for(let c of n) h=(h*31+c.charCodeAt(0))%256; return COLORS[Math.abs(h)%COLORS.length]; }
function getIni(n) { return n.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

function switchTab(t) {
  ['mes','lista'].forEach((id,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', id===t);
    document.getElementById('tab-'+id).classList.toggle('active', id===t);
  });
  if (t==='lista') renderLista();
}

function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 11) { currentMonth=0; currentYear++; }
  if (currentMonth < 0) { currentMonth=11; currentYear--; }
  renderMes();
}

function renderMes() {
  const today = new Date();
  const tD = today.getDate(), tM = today.getMonth(), tY = today.getFullYear();
  document.getElementById('month-label').textContent = MESES[currentMonth] + ' ' + currentYear;
  const list = ALUMNOS.filter(a => a.mes === currentMonth).sort((a,b) => a.dia - b.dia);
  const pagados = list.filter(a => isPaid(a)).length;
  document.getElementById('month-count').textContent = list.length + ' cumpleaños';
  document.getElementById('s-total').textContent = list.length;
  document.getElementById('s-paid').textContent = pagados;
  document.getElementById('s-pending').textContent = list.length - pagados;

  const isCurr = currentMonth === tM && currentYear === tY;
  const cont = document.getElementById('bday-list');
  if (!list.length) {
    cont.innerHTML = '<div class="empty-msg">No hay cumpleaños en ' + MESES[currentMonth] + '.<br>Usá las flechas para navegar otros meses.</div>';
    return;
  }

  cont.innerHTML = list.map(a => {
    const col = colorFor(a.nombre);
    const paid = isPaid(a);
    const isToday = isCurr && a.dia === tD;
    const isUpcoming = isCurr && a.dia > tD && a.dia <= tD + 7;
    const isPast = isCurr && a.dia < tD;
    const dayClass = isToday ? 'c-green' : isUpcoming ? 'c-amber' : isPast ? 'c-gray' : '';
    const cardClass = 'bday-card' + (paid ? ' is-paid' : isToday ? ' is-today' : isUpcoming ? ' is-upcoming' : '');

    let statusHtml = '';
    if (paid) statusHtml = '<span class="spill s-paid">✓ Pagado</span>';
    else if (isToday) statusHtml = '<span class="spill s-today">Hoy</span>';
    else if (isUpcoming) statusHtml = '<span class="spill s-upcoming">En ' + (a.dia - tD) + ' días</span>';

    const cbuShort = a.cbu.length > 22 ? a.cbu.slice(0,10) + '…' + a.cbu.slice(-6) : a.cbu;
    const payLabel = paid ? 'Desmarcar' : 'Marcar pagado';
    const payClass = 'pay-btn' + (paid ? ' paid' : '');
    const safeNombre = a.nombre.replace(/'/g, "\\'");

    return `<div class="${cardClass}">
      <div class="day-col"><div class="day-num ${dayClass}">${a.dia}</div></div>
      <div class="avatar" style="background:${col.bg};color:${col.text};">${getIni(a.nombre)}</div>
      <div class="bday-main">
        <div class="bday-top"><span class="bday-name">${a.nombre}</span>${statusHtml}</div>
        <div class="bday-sub">Transferir a: <strong>${a.padre}</strong></div>
        <div class="bday-sub">${a.banco}</div>
        <div class="bday-cbu">${cbuShort}</div>
        ${a.alias ? `<div class="bday-alias">@${a.alias}</div>` : ''}
      </div>
      <div class="actions">
        <button class="copy-btn" onclick="copyText('${a.cbu}', this)">Copiar CBU</button>
        ${a.alias ? `<button class="copy-btn" onclick="copyText('${a.alias}', this)">Copiar alias</button>` : ''}
        <button class="${payClass}" onclick="togglePago('${safeNombre}', ${a.mes}, ${a.dia})">
          <div class="check-circle">
            <svg class="check-svg" width="9" height="7" viewBox="0 0 9 7" fill="none">
              <path d="M1 3.5L3.5 6L8 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          ${payLabel}
        </button>
      </div>
    </div>`;
  }).join('');
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ Copiado!';
    btn.style.color = 'var(--green)';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    const orig = btn.textContent;
    btn.textContent = '✓ Copiado!';
    setTimeout(() => { btn.textContent = orig; }, 2000);
  });
}

function renderLista() {
  const sorted = ALUMNOS.slice().sort((a,b) => a.mes - b.mes || a.dia - b.dia);
  document.getElementById('list-count').textContent = sorted.length + ' alumnos';
  let lastMes = -1;
  document.getElementById('full-list').innerHTML = sorted.map(a => {
    const col = colorFor(a.nombre);
    const paid = isPaid(a);
    let sep = '';
    if (a.mes !== lastMes) { sep = `<div class="mes-sep">${MESES[a.mes]}</div>`; lastMes = a.mes; }
    return `${sep}<div class="list-item">
      <div class="list-av" style="background:${col.bg};color:${col.text};">${getIni(a.nombre)}</div>
      <div class="list-info">
        <div class="list-name">${a.nombre}</div>
        <div class="list-detail">${a.dia} ${MESES[a.mes]} · ${a.padre} · ${a.banco}</div>
      </div>
      ${paid
        ? '<span class="paid-badge">✓ Pagado</span>'
        : '<span class="pending-badge">Pendiente</span>'
      }
    </div>`;
  }).join('');
}

renderMes();
</script>
</body>
</html>
