
<style>

.tab.active { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-primary); font-weight: 500; }

.month-btn { width: 32px; height: 32px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: transparent; cursor: pointer; font-size: 16px; color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center; font-family: var(--font-sans); }
.month-btn:hover { background: var(--color-background-secondary); }

.bday-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 0.9rem 1.1rem; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 14px; }

.bday-card.is-upcoming { border-color: #BA7517; border-width: 1px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 14px; flex-shrink: 0; margin-top: 2px; }
.bday-main { flex: 1; min-width: 0; }
.bday-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
.bday-name { font-weight: 500; font-size: 14px; color: var(--color-text-primary); }
.status-pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
.s-today { background: #E1F5EE; color: #085041; }
.s-upcoming { background: #FAEEDA; color: #633806; }
.bday-parent { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 2px; }
.bday-bank { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 2px; }
.bday-cbu { font-size: 12px; color: var(--color-text-secondary); font-family: var(--font-mono); word-break: break-all; }
.bday-alias { font-size: 12px; color: var(--color-text-secondary); }
.day-col { min-width: 38px; text-align: center; padding-top: 3px; }
.day-num { font-size: 22px; font-weight: 500; line-height: 1; }
.day-num.c-green { color: #0F6E56; }
.day-num.c-amber { color: #854F0B; }
.day-num.c-gray { color: var(--color-text-secondary); }
.copy-btn { padding: 5px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: transparent; cursor: pointer; font-size: 12px; color: var(--color-text-secondary); font-family: var(--font-sans); white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
.copy-btn:hover { background: var(--color-background-secondary); }
.summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
.summary-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.7rem 1rem; }
.summary-num { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
.summary-lbl { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.list-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
.mes-sep { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); letter-spacing: 0.06em; text-transform: uppercase; margin: 1.1rem 0 6px; }
.list-item { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 0.65rem 1rem; margin-bottom: 7px; display: flex; align-items: center; gap: 10px; }
.list-av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 12px; flex-shrink: 0; }
.list-info { flex: 1; min-width: 0; }
.list-name { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
.list-detail { font-size: 12px; color: var(--color-text-secondary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-label { font-size: 12px; color: var(--color-text-secondary); font-weight: 500; }
input, select { font-family: var(--font-sans); font-size: 14px; }
.add-btn { width: 100%; padding: 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-secondary); cursor: pointer; font-size: 14px; font-weight: 500; color: var(--color-text-primary); font-family: var(--font-sans); margin-top: 4px; }
.add-btn:hover { background: var(--color-background-tertiary); }

</style>

<div class="app">

</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('mes')">Este mes</button>
  <button class="tab" onclick="switchTab('agregar')">Agregar alumno</button>

</div>

    <div class="month-nav">
      <button class="month-btn" onclick="changeMonth(-1)">&#8592;</button>
      <div class="month-label" id="month-label"></div>
      <button class="month-btn" onclick="changeMonth(1)">&#8594;</button>
    </div>

  </div>
  <div class="summary-bar">
    <div class="summary-card"><div class="summary-num" id="s-total">0</div><div class="summary-lbl">cumpleaños</div></div>
    <div class="summary-card"><div class="summary-num" id="s-today" style="color:#0F6E56;">0</div><div class="summary-lbl">hoy</div></div>
    <div class="summary-card"><div class="summary-num" id="s-prox" style="color:#854F0B;">0</div><div class="summary-lbl">próximos 7 días</div></div>

<div id="tab-agregar" class="section">
  <div class="form-grid">
    <div class="form-group"><label class="form-label">Nombre del alumno/a</label><input type="text" id="f-nombre" placeholder="Ej: Lucía García" /></div>
    <div class="form-group"><label class="form-label">Día de cumpleaños</label><select id="f-dia"></select></div>
    <div class="form-group"><label class="form-label">Mes de cumpleaños</label><select id="f-mes">
      <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
      <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
      <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
      <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
    </select></div>
    <div class="form-group"><label class="form-label">Nombre del padre/madre</label><input type="text" id="f-padre" placeholder="Ej: María González" /></div>
  </div>
  <div class="form-group" style="margin-bottom:12px;"><label class="form-label">CBU / CVU</label><input type="text" id="f-cbu" placeholder="Ej: 0000003100049842116799" /></div>
  <div class="form-group" style="margin-bottom:12px;"><label class="form-label">Alias (opcional)</label><input type="text" id="f-alias" placeholder="Ej: PLAYA.ETER.PAPEL" /></div>
  <div class="form-group" style="margin-bottom:12px;"><label class="form-label">Banco (opcional)</label><input type="text" id="f-banco" placeholder="Ej: BBVA, Mercado Pago..." /></div>
  <button class="add-btn" onclick="agregarAlumno()">+ Agregar alumno</button>
  <div id="form-msg" class="form-msg"></div>
</div>

<div id="tab-lista" class="section">
  <div class="list-header">
    <span class="list-title">Todos los alumnos</span>
    <span style="font-size:13px;color:var(--color-text-secondary);" id="list-count"></span>
  </div>
  <div id="full-list"></div>
</div>
</div>

<script>
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const COLORS = [
  {bg:'#EEEDFE',text:'#3C3489'},{bg:'#E1F5EE',text:'#085041'},
  {bg:'#FAECE7',text:'#712B13'},{bg:'#FBEAF0',text:'#72243E'},
  {bg:'#E6F1FB',text:'#0C447C'},{bg:'#EAF3DE',text:'#27500A'},
  {bg:'#FAEEDA',text:'#633806'},{bg:'#FCEBEB',text:'#791F1F'}
];

const DATOS_BASE = [
  {nombre:'Santiago Blanco Torralba',dia:3,mes:2,padre:'Soledad',cbu:'0170346540000041755329',alias:'santibb2016',banco:'BBVA',titular:'Torralba Soledad'},
  {nombre:'Jean Brandon Perez Vallejo',dia:1,mes:3,padre:'Miguel',cbu:'0000003100049842116799',alias:'',banco:'Mercado Pago',titular:'Miguel Enrique Perez Castillo'},
  {nombre:'Sophie Solignac',dia:11,mes:3,padre:'Lorena / Alejandro',cbu:'0000003100036891160020',alias:'futuremoney.mp',banco:'Mercado Pago',titular:'Lorena Daniela Rodriguez'},
  {nombre:'Simón Karsz',dia:13,mes:4,padre:'Marcia / Ezequiel',cbu:'0140019903401904676851',alias:'BEBE.LORO.POZO',banco:'Provincia BS.AS.',titular:'Marcia Andrea Picetti Salvo'},
  {nombre:'Cruz Serra Oyuela',dia:23,mes:4,padre:'Victoria / Leo',cbu:'0720000788000016588190',alias:'Leoserra',banco:'Santander',titular:'Serra Niccolls Leonardo Jose'},
  {nombre:'Emilia Malikova',dia:4,mes:5,padre:'Elena',cbu:'0000003100009773904348',alias:'elena.776.diurno.mp',banco:'Mercado Pago',titular:'Elena Malikova'},
  {nombre:'Ambar Mmarilungo',dia:6,mes:5,padre:'Maira / Sebas',cbu:'0000003100057509403717',alias:'pm.porotos',banco:'Mercado Pago',titular:'Maira Sabrina Goytia'},
  {nombre:'Renata Juarez',dia:21,mes:5,padre:'Graciela y Victor',cbu:'0070234030004051988114',alias:'GRABARROS.GAL',banco:'Galicia',titular:'Graciela Del Rosario Barros'},
  {nombre:'Francesca Prieto Mori',dia:9,mes:6,padre:'Natalia / Sergio',cbu:'2850540440094039620858',alias:'natalia79macro',banco:'Macro',titular:'Mori Natalia Vanesa'},
  {nombre:'Joaquin Gil Molina',dia:18,mes:7,padre:'Alina / Nico',cbu:'0110016730001610858965',alias:'alina.molina',banco:'BNA+',titular:'Alina Laura Molina'},
  {nombre:'Valentina Bertonazzi',dia:27,mes:7,padre:'Belen / Dany',cbu:'0170019020000001062388',alias:'MUNDOHARINAVIRTUAL',banco:'BBVA',titular:'Bertonazzi Daniel Alfred'},
  {nombre:'Gael Lux',dia:4,mes:8,padre:'Vero',cbu:'0170101840000005858282',alias:'MANERA.LOMA.ARCO',banco:'BBVA',titular:'Follonier Graciela'},
  {nombre:'Federico Belen',dia:18,mes:8,padre:'Gabriela / Gabriel',cbu:'0170182740000031714961',alias:'G.MARECHAL',banco:'BBVA',titular:'Marechal Gabriela'},
  {nombre:'Benjamin Lopez Hogrefe',dia:4,mes:9,padre:'Sergio / Romi',cbu:'0720166688000001391686',alias:'CUBETA.ALTURA.ASTRO',banco:'Santander',titular:'Lopez Sergio Daniel'},
  {nombre:'Avril Gonzalez Parada',dia:29,mes:9,padre:'Norma',cbu:'0720197088000002945554',alias:'MADRID.SOMBRA.FLAUTA',banco:'Santander',titular:'Norma Ines Parada Sanchez'},
  {nombre:'Anita Santiago',dia:1,mes:10,padre:'Valeria',cbu:'0720413988000001633236',alias:'TROTE AYUNO.ALTURA',banco:'Santander',titular:'Guastini Valeria'},
  {nombre:'Priya De Bello',dia:10,mes:10,padre:'Ingrid / Luis',cbu:'0140014403401451487908',alias:'SERIE.MOSCU.NAIPE',banco:'Provincia BS.As.',titular:'Elba Ingrid Orellano'},
  {nombre:'Agustina Mastromarino',dia:14,mes:10,padre:'Viviana / Jorge',cbu:'0170304540000036449079',alias:'PLAYA.ETER.PAPEL',banco:'BBVA',titular:'Mastromarino Jorge'},
  {nombre:'Maia',dia:20,mes:10,padre:'Romina',cbu:'0170196440000001108480',alias:'ROMINACORREABBVA',banco:'BBVA',titular:'Correa Romina'},
  {nombre:'Eva Dodero Arias',dia:27,mes:10,padre:'Agustina / Jorge',cbu:'0720176588000036097618',alias:'ACEITE.OBOE.LANA',banco:'Santander',titular:'Arias Almonacid Jorge Rolando'},
  {nombre:'Leonel Albarenga Caggiano',dia:2,mes:11,padre:'Barbara / Alejandro',cbu:'0170035040000001620360',alias:'MIEL.RULO.RAYO',banco:'BBVA',titular:'Albarenga Alejandro'},
  {nombre:'Isabella Blanco Perez',dia:17,mes:11,padre:'Silvana / Fernando',cbu:'0720055788000037300304',alias:'silvanadelourdes',banco:'Santander',titular:'Perez Silvana De Lourdes'},
  {nombre:'Lina Ñancucheu',dia:29,mes:11,padre:'Florencia',cbu:'0150925401000125408715',alias:'LAMINA.AFRICA.ASTRO',banco:'ICBC',titular:'Adrian Gustavo Ñancucheu'},
];

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

function getAlumnos() {
  try {
    const stored = JSON.parse(localStorage.getItem('alumnos_5toA') || 'null');
    if (stored) return stored;
  } catch {}
  const base = DATOS_BASE.map((a,i) => ({...a, id: 1000+i}));
  saveAlumnos(base);
  return base;
}
function saveAlumnos(a) { try { localStorage.setItem('alumnos_5toA', JSON.stringify(a)); } catch {} }

function colorFor(name) {
  let h = 0;
  for (let c of name) h = (h * 31 + c.charCodeAt(0)) % 256;
  return COLORS[Math.abs(h) % COLORS.length];
}
function initials(name) { return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

function switchTab(t) {
  ['mes','agregar','lista'].forEach((id,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', id===t);
    document.getElementById('tab-'+id).classList.toggle('active', id===t);
  });
  if (t==='lista') renderLista();
}

function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 11) { currentMonth=0; currentYear++; }
  if (currentMonth < 0) { currentMonth=11; currentYear--; }
  renderMes();
}

function renderMes() {
  const today = new Date();
  const tDay = today.getDate(), tMonth = today.getMonth(), tYear = today.getFullYear();
  document.getElementById('month-label').textContent = MESES[currentMonth] + ' ' + currentYear;
  const alumnos = getAlumnos().filter(a=>a.mes===currentMonth).sort((a,b)=>a.dia-b.dia);
  document.getElementById('month-pill').textContent = alumnos.length + (alumnos.length===1?' cumpleaños':' cumpleaños');
  let countToday=0, countProx=0;
  alumnos.forEach(a=>{
    const isCurrent = currentMonth===tMonth && currentYear===tYear;
    if (isCurrent && a.dia===tDay) countToday++;
    else if (isCurrent && a.dia>tDay && a.dia<=tDay+7) countProx++;
  });
  document.getElementById('s-total').textContent = alumnos.length;
  document.getElementById('s-today').textContent = countToday;
  document.getElementById('s-prox').textContent = countProx;

  const cont = document.getElementById('bday-list');
  if (!alumnos.length) { cont.innerHTML = '<div class="empty-msg">No hay cumpleaños en '+MESES[currentMonth]+'.</div>'; return; }

  cont.innerHTML = alumnos.map(a => {
    const col = colorFor(a.nombre);
    const ini = initials(a.nombre);
    const isCurrent = currentMonth===tMonth && currentYear===tYear;
    const isToday = isCurrent && a.dia===tDay;
    const isUpcoming = isCurrent && a.dia>tDay && a.dia<=tDay+7;
    const dayClass = isToday ? 'c-green' : isUpcoming ? 'c-amber' : 'c-gray';
    let cardClass = 'bday-card' + (isToday?' is-today':isUpcoming?' is-upcoming':'');
    let statusHtml = isToday ? '<span class="status-pill s-today">Hoy</span>' : isUpcoming ? '<span class="status-pill s-upcoming">En '+(a.dia-tDay)+' días</span>' : '';
    const cbuDisplay = a.cbu.length>22 ? a.cbu.slice(0,10)+'...'+a.cbu.slice(-6) : a.cbu;
    return `<div class="${cardClass}">
      <div class="day-col"><div class="day-num ${dayClass}">${a.dia}</div></div>
      <div class="avatar" style="background:${col.bg};color:${col.text};">${ini}</div>
      <div class="bday-main">
        <div class="bday-top"><span class="bday-name">${a.nombre}</span>${statusHtml}</div>
        <div class="bday-parent">Transferir a: <strong>${a.padre}</strong>${a.titular?' ('+a.titular+')':''}</div>
        ${a.banco?`<div class="bday-bank">${a.banco}</div>`:''}
        <div class="bday-cbu">CBU/CVU: ${cbuDisplay}</div>
        ${a.alias?`<div class="bday-alias">Alias: ${a.alias}</div>`:''}
      </div>
      <button class="copy-btn" onclick="copyText('${a.cbu}',this,'CBU')">Copiar CBU</button>
    </div>`;
  }).join('');
}

function copyText(text, btn, label) {
  navigator.clipboard.writeText(text).then(()=>{
    const orig = btn.textContent;
    btn.textContent = '¡Copiado!';
    btn.style.color = '#0F6E56';
    setTimeout(()=>{ btn.textContent=orig; btn.style.color=''; }, 1800);
  });
}

function renderLista() {
  const alumnos = getAlumnos().sort((a,b)=>a.mes-b.mes||a.dia-b.dia);
  document.getElementById('list-count').textContent = alumnos.length + ' alumnos';
  let lastMes = -1;
  document.getElementById('full-list').innerHTML = alumnos.map(a=>{
    const col = colorFor(a.nombre);
    const ini = initials(a.nombre);
    let sep = '';
    if (a.mes!==lastMes) { sep=`<div class="mes-sep"${lastMes===-1?'':' style="margin-top:1rem;"'}>${MESES[a.mes]}</div>`; lastMes=a.mes; }
    return `${sep}<div class="list-item">
      <div class="list-av" style="background:${col.bg};color:${col.text};">${ini}</div>
      <div class="list-info">
        <div class="list-name">${a.nombre}</div>
        <div class="list-detail">${a.dia} ${MESES[a.mes]} · ${a.padre}${a.banco?' · '+a.banco:''}</div>
      </div>
      <button class="copy-btn" onclick="copyText('${a.cbu}',this,'CBU')" style="margin-top:0;">CBU</button>
      <button class="copy-btn" onclick="eliminar(${a.id})" style="color:#A32D2D;margin-top:0;">×</button>
    </div>`;
  }).join('');
}

function agregarAlumno() {
  const nombre = document.getElementById('f-nombre').value.trim();
  const cbu = document.getElementById('f-cbu').value.trim();
  const padre = document.getElementById('f-padre').value.trim();
  const alias = document.getElementById('f-alias').value.trim();
  const banco = document.getElementById('f-banco').value.trim();
  const dia = parseInt(document.getElementById('f-dia').value);
  const mes = parseInt(document.getElementById('f-mes').value);
  const msg = document.getElementById('form-msg');
  if (!nombre||!cbu) { msg.style.color='#A32D2D'; msg.textContent='Completá al menos el nombre y el CBU/CVU.'; return; }
  const alumnos = getAlumnos();
  alumnos.push({nombre,dia,mes,padre,cbu,alias,banco,titular:'',id:Date.now()});
  saveAlumnos(alumnos);
  ['f-nombre','f-cbu','f-padre','f-alias','f-banco'].forEach(id=>document.getElementById(id).value='');
  msg.style.color='#0F6E56'; msg.textContent=nombre+' agregado/a correctamente.';
  setTimeout(()=>msg.textContent='',3000);
  renderMes();
}

function eliminar(id) {
  if (!confirm('¿Eliminar este alumno?')) return;
  saveAlumnos(getAlumnos().filter(a=>a.id!==id));
  renderLista(); renderMes();
}

function initDias() {
  const sel = document.getElementById('f-dia');
  for (let i=1;i<=31;i++) { const o=document.createElement('option'); o.value=i; o.textContent=i; sel.appendChild(o); }
}

initDias();
document.getElementById('f-mes').value = new Date().getMonth();
renderMes();
</script>
